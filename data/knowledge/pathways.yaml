  - id: "hsa04120"
    name: "Ubiquitin mediated proteolysis"
    source: KEGG
    genes: [MDM2, UBE3A, VHL, CUL1, CUL2, SKP1, SKP2, FBXW7, BRCA1, UBE2D1, UBE2D2, TP53]
