# A small, curated set of well-established pathway gene sets, used for
# hypergeometric enrichment testing (bioinformatics/pathway_enrichment.py).
#
# This is a deliberately small embedded subset, not a full KEGG/Reactome
# mirror — real gene memberships for genuinely well-known pathways, enough to
# make the enrichment statistics meaningful and testable end-to-end. Scaling
# to the full KEGG/Reactome/GO gene set collections (tens of thousands of
# sets) is a data-loading change, not an algorithm change — see
# bioinformatics/pathway_enrichment.py and docs/scaling-to-real-genomes.md.

background_gene_count: 20000  # approx. number of human protein-coding genes (the statistical universe)

pathways:
  - id: "hsa04115"
    name: "p53 signaling pathway"
    source: KEGG
    genes: [TP53, MDM2, MDM4, ATM, ATR, CHEK1, CHEK2, CDKN1A, BAX, BBC3, CASP9, GADD45A, RRM2B, SERPINB5, THBS1]

  - id: "hsa04151"
    name: "PI3K-Akt signaling pathway"
    source: KEGG
    genes: [PIK3CA, PIK3CB, PIK3R1, AKT1, AKT2, AKT3, PTEN, MTOR, TSC1, TSC2, GSK3B, FOXO1, FOXO3, BAD, BCL2, MDM2, CDKN1A, CDKN1B]

  - id: "hsa04010"
    name: "MAPK signaling pathway"
    source: KEGG
    genes: [KRAS, HRAS, NRAS, BRAF, RAF1, MAP2K1, MAP2K2, MAPK1, MAPK3, MAPK8, MAPK9, MAPK14, JUN, FOS, MYC, EGFR]

  - id: "hsa04110"
