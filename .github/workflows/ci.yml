name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e apps/api[dev]
      - run: ruff check apps/api/src apps/api/tests
      - run: mypy apps/api/src

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: targetforge
          POSTGRES_PASSWORD: targetforge
          POSTGRES_DB: targetforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U targetforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://targetforge:targetforge@localhost:5432/targetforge
      AUTH_DISABLED_FOR_LOCAL_DEV: "true"
      TARGETFORGE_PATHWAYS_PATH: ${{ github.workspace }}/data/knowledge/pathways.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e apps/api[dev]
      - name: Run migrations
        working-directory: apps/api
        run: python -m alembic upgrade head
      # No --cov-fail-under gate yet: only the pure bioinformatics unit tests
      # exist today (agent-level tests with FakeLlmClient, and DB-backed
      # integration tests, are tracked in docs/runbook.md's "Not yet built").
      # Add the coverage gate once those exist, rather than picking an
      # arbitrary number that either blocks on missing tests or is trivially
      # satisfied by what's here now.
      - name: Unit tests
        working-directory: apps/api
        run: python -m pytest -q --cov=targetforge --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apps/api/coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed — CI validates the build only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: targetforge-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bicep-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: az bicep build (lint/compile check, no Azure credentials needed)
        run: |
          az bicep build --file infra/bicep/main.bicep --stdout > /dev/null
        shell: bash
